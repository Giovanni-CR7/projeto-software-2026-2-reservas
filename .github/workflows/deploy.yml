name: Java CI with Maven

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Compilando o projeto com Maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml

      # Fazendo login no Docker Hub com a sua secret
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "givil"
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Fazendo o build e mandando para o Docker Hub com o nome certo (reservas-ci)
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: givil/reservas-ci:${{ github.sha }}

      # Acessando a AWS para rodar a aplicacao
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: "ubuntu"
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            # Parando e removendo o container antigo caso exista
            docker stop reservas || true
            docker rm --force reservas || true
            
            # Subindo o novo container com todas as configuracoes exigidas pelo Passo 3
            docker run -d -p 8080:8080 \
              --network=rede \
              --name reservas \
              -e DB_HOST=postgres-aula \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              givil/reservas-ci:${{ github.sha }}